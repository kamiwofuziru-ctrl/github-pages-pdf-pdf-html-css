<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>資料一覧 | 菫青の大学入試数学資料保管庫</title>
    <meta name="description" content="菫青の大学入試数学資料保管庫に公開されている数学PDF資料の一覧です。">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/materials.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="菫青の大学入試数学資料保管庫 ホーム">
        <span class="brand-mark" aria-hidden="true">kinsei</span>
        <span class="brand-text">菫青の大学入試数学資料保管庫</span>
      </a>
      <nav class="site-nav" aria-label="主要ナビゲーション">
        <a href="./index.html">トップ</a>
        <a class="is-active" href="./materials.html">資料一覧</a>
        <a href="./about.html">このサイトについて</a>
        <a href="./contact.html">連絡先</a>
      </nav>
    </header>

    <main id="main">
      <section class="page-hero">
        <p class="eyebrow">Materials</p>
        <h1>資料一覧</h1>
        <p>高校数学の大分類から入り、必要なら単元や資料種別で絞り込めます。細かく分類しても、大きな入口から迷わず探せる一覧です。</p>
      </section>

      <section class="materials-layout" aria-label="資料検索と一覧">
        <aside class="filter-panel" aria-label="資料の絞り込み">
          <p class="filter-kicker">Filter</p>
          <div class="field-group">
            <label for="keywordSearch">キーワード検索</label>
            <input id="keywordSearch" type="search" placeholder="例: 数学Ⅰ ベクトル 基礎" autocomplete="off">
          </div>
          <div class="field-group">
            <p class="control-label" id="courseFilterLabel">大分類</p>
            <div class="filter-buttons" id="courseFilter" role="group" aria-labelledby="courseFilterLabel"></div>
          </div>
          <div class="field-group">
            <label for="unitFilter">小分類</label>
            <select id="unitFilter">
              <option value="all">すべての小分類</option>
            </select>
          </div>
          <div class="field-group">
            <p class="control-label" id="typeFilterLabel">資料種別</p>
            <div class="filter-buttons compact" id="typeFilter" role="group" aria-labelledby="typeFilterLabel"></div>
          </div>
          <button class="button ghost" id="resetFilters" type="button">条件をクリア</button>
        </aside>

        <section class="list-panel" aria-label="PDF資料一覧">
          <div class="list-toolbar">
            <div>
              <p class="eyebrow">Library</p>
              <h2>公開PDF</h2>
            </div>
            <p class="material-count" id="materialCount">読み込み中</p>
          </div>
          <div class="materials-grid" id="materialsList" aria-live="polite"></div>
          <p class="empty-message" id="emptyMessage" hidden>該当する資料がありません。キーワードやカテゴリを変えてお試しください。</p>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <p><span class="mono">data/materials.json</span> の内容を読み込んで表示しています。</p>
    </footer>
  </body>
</html>
